name: CI/CD Pipeline

on:
  push:
    branches: [main, master, development]
  pull_request:
    branches: [main, master, development]

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # JOB 1 — Dependency Audit
  # Checks for known security vulnerabilities in your packages.
  # Blocks on HIGH or CRITICAL severity. Warns on moderate.
  # ════════════════════════════════════════════════════════════════════════════
  audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit for vulnerabilities
        # --audit-level=high: fails only on high/critical, warns on moderate
        run: pnpm audit --audit-level=high

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 2 — Type-check & Build
  # Compiles TypeScript. If this fails, your code has type errors and
  # will not run correctly. Blocks deploy entirely.
  # ════════════════════════════════════════════════════════════════════════════
  build:
    name: Type-check & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check & compile TypeScript
        run: pnpm build

      - name: Verify dist output exists
        run: |
          if [ ! -f "dist/server.js" ]; then
            echo "ERROR: dist/server.js not found — build may have failed silently"
            exit 1
          fi
          echo "Build output verified: dist/server.js exists"

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 3 — Docker Build Validation
  # Builds the Docker image exactly as Render will.
  # Catches issues like: missing files, broken COPY paths, wrong Node version.
  # Does NOT push the image — only validates it builds successfully.
  # Runs in parallel with the build job to save time.
  # ════════════════════════════════════════════════════════════════════════════
  docker-validate:
    name: Docker Build Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (validation only — no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: odoo-backend:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 4 — Environment & Secrets Validation
  # Checks that all required GitHub secrets are configured before deploying.
  # Fails early with a clear message if a secret is missing or empty.
  # ════════════════════════════════════════════════════════════════════════════
  validate-secrets:
    name: Validate Deployment Secrets
    runs-on: ubuntu-latest
    # Only matters when we're about to deploy
    if: github.event_name == 'push' && (github.ref == 'refs/heads/development')
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      RENDER_APP_URL: ${{ secrets.RENDER_APP_URL }}

    steps:
      - name: Check required deployment secrets
        run: |
          MISSING=""

          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            MISSING="${MISSING}\n  ✗ RENDER_DEPLOY_HOOK_URL — go to Render > Settings > Deploy Hook"
          else
            echo "  ✓ RENDER_DEPLOY_HOOK_URL is set"
          fi

          if [ -z "$RENDER_APP_URL" ]; then
            MISSING="${MISSING}\n  ✗ RENDER_APP_URL — your Render service URL, e.g. https://your-app.onrender.com"
          else
            echo "  ✓ RENDER_APP_URL is set"
          fi

          if [ -n "$MISSING" ]; then
            echo ""
            echo "Missing GitHub secrets. Add them at:"
            echo "GitHub repo → Settings → Secrets and variables → Actions"
            echo ""
            printf "Missing:$MISSING\n"
            exit 1
          fi

          echo "All required secrets are configured."

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 5 — Deploy to Render
  # Only runs when ALL previous jobs pass AND this is a push to main/master.
  # Pull requests never reach this job.
  # After deploy, waits for Render to start then runs a health check.
  # ════════════════════════════════════════════════════════════════════════════
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [audit, build, docker-validate, validate-secrets]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/development')
    env:
      RENDER_APP_URL: ${{ secrets.RENDER_APP_URL }}

    steps:
      - name: Trigger Render deploy
        run: |
          echo "Triggering Render deployment..."
          RESPONSE=$(curl --silent --write-out "\n%{http_code}" \
            --fail -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ] && [ "$HTTP_CODE" != "202" ]; then
            echo "Render deploy hook failed with HTTP $HTTP_CODE"
            exit 1
          fi
          echo "Deploy triggered successfully (HTTP $HTTP_CODE)"

      - name: Wait for Render to deploy
        run: |
          echo "Waiting 90s for Render to build and start the container..."
          sleep 90

      - name: Health check — verify app is running
        run: |
          echo "Running health check against $RENDER_APP_URL/health"
          MAX_RETRIES=5
          WAIT=15
          for i in $(seq 1 $MAX_RETRIES); do
            HTTP_CODE=$(curl --silent --output /dev/null --write-out "%{http_code}" \
              --max-time 30 "$RENDER_APP_URL/health")
            echo "Attempt $i/$MAX_RETRIES — HTTP $HTTP_CODE"
            # 200 or 404 both mean the server is running (404 = route not found, but server responded)
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Health check passed — app is live at $RENDER_APP_URL"
              exit 0
            fi
            if [ $i -lt $MAX_RETRIES ]; then
              echo "Not ready yet, waiting ${WAIT}s..."
              sleep $WAIT
            fi
          done
          echo "Health check failed after $MAX_RETRIES attempts — check Render logs"
          exit 1
